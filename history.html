<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>コメント履歴</title>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 24px;
    }

    /* ============================
       テーブルのレスポンシブ対応
       ============================ */
    .table-wrapper {
      overflow-x: auto;                 /* スマホで横スクロール */
      -webkit-overflow-scrolling: touch; /* スマホで滑らかスクロール */
      width: 100%;
    }

    table {
      width: 100%;
      min-width: 800px;                 /* PC向け最低幅 */
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      font-size: 14px;
      word-break: break-all;
    }

    th {
      background: #f0f0f0;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }

    /* ============================
       スマホ向け調整
       ============================ */
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 20px;
        margin-bottom: 15px;
      }

      th, td {
        font-size: 12px;
        padding: 6px;
      }

      table {
        min-width: 600px; /* スマホでは横スクロール前提 */
      }
    }
  </style>
</head>

<body>
  <h1>コメント履歴（ローカル CSV）</h1>

  <div class="table-wrapper">
    <table id="historyTable">
      <thead>
        <tr>
          <th>時間</th>
<!--	  <th>学籍番号</th>  -->
          <th>コメント</th>
<!--	  <th>色</th>  -->
<!--	  <th>サイズ</th>  -->
<!--	  <th>速度</th>  -->
<!--	  <th>固定</th>  -->
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    async function loadHistory() {
      const rows = await window.electronAPI.loadHistory();

      const tbody = document.querySelector('#historyTable tbody');
      tbody.innerHTML = '';

      rows.forEach(row => {
        const tr = document.createElement('tr');

        tr.innerHTML = `
          <td>${row.time}</td>
<!--	  <td>${row.studentId}</td>  -->
          <td>${row.text}</td>
<!--	  <td>${row.color}</td>  -->
<!--	  <td>${row.size}</td>  -->
<!--	  <td>${row.speed}</td>  -->
<!--	  <td>${row.fixed ? "固定" : ""}</td>  -->
        `;

        tbody.appendChild(tr);
      });
    }

    loadHistory();
  </script>

</body>
</html>
