<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: rgba(0,0,0,0);
    }

    .comment {
      position: absolute;
      white-space: nowrap;
      text-shadow: 2px 2px 4px black;
      font-weight: bold;
    }
  </style>
</head>
<body>
<script>
  /* ================================
     WebSocket 自動再接続（切断検知）
     ================================ */

  let ws = null;

  function connectWS() {
    ws = new WebSocket('wss://danmaku-server.onrender.com');

    ws.onopen = () => {
      console.log("WebSocket connected");
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      spawnComment(data);
      window.electronAPI.saveComment(data);
    };

    ws.onerror = (err) => {
      console.log("WebSocket error:", err);
      ws.close(); // → onclose が発火する
    };

    ws.onclose = () => {
      console.log("WebSocket closed. Reconnecting in 3 seconds...");
      setTimeout(connectWS, 3000);  // ★ 切断時だけ再接続
    };
  }

  connectWS(); // 初回接続


  /* ================================
     レーン管理（重ならない弾幕）
     ================================ */

  const laneCount = 20;
  const lanes = Array(laneCount).fill(0);

  // ★ 最大フォントサイズ（xlarge = 120px）を安全マージンとして確保
  const maxFontSize = 120;

  // ★ タスクバーを含む画面全体の高さ
  const fullHeight = window.screen.height;

  // ★ 画面下の120pxを使わない「安全な高さ」
  const effectiveHeight = fullHeight - maxFontSize;

  // ★ この高さをレーンに割り当てる
  const laneHeight = effectiveHeight / laneCount;

  function getLane(durationMs) {
    const now = performance.now();
    let bestLane = 0;
    let earliest = Infinity;

    for (let i = 0; i < laneCount; i++) {
      if (lanes[i] < earliest) {
        earliest = lanes[i];
        bestLane = i;
      }
    }

    lanes[bestLane] = now + durationMs;
    return bestLane;
  }

  /* ================================
     コメント生成
     ================================ */
  function spawnComment({ text, color, size, speed, fixed }) {
    const div = document.createElement('div');
    div.className = 'comment';
    div.textContent = text;

    div.style.color = color || '#000000';

    const sizeMap = { small: '48px', medium: '60px', large: '90px', xlarge: '120px' };
    div.style.fontSize = sizeMap[size] || '60px';

    if (fixed === true || fixed === "true") {
      const lane = Math.floor(Math.random() * laneCount);
      const y = lane * laneHeight;

      div.style.left = '50%';
      div.style.top = y + 'px';
      div.style.transform = 'translateX(-50%)';

      document.body.appendChild(div);
      setTimeout(() => div.remove(), 3000);
      return;
    }

    const duration = speed || 12;
    const durationMs = duration * 1000;

    const lane = getLane(durationMs);
    const y = lane * laneHeight;

    div.style.top = y + 'px';

    let x = window.innerWidth;
    div.style.left = x + 'px';

    document.body.appendChild(div);

    const pxPerSec = window.innerWidth / duration;
    const pxPerFrame = pxPerSec / 60;

    function animate() {
      x -= pxPerFrame;
      div.style.left = x + 'px';

      const rect = div.getBoundingClientRect();
      if (rect.right < 0) {
        div.remove();
        return;
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  }
</script>
</body>
</html>
