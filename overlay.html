<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: rgba(0,0,0,0); /* 完全透明 */
    }

    .comment {
      position: absolute;
      white-space: nowrap;
      font-weight: bold;
      text-shadow: 2px 2px 4px black;
    }

    /* ★ 発光エフェクト（glow=true のとき適用） */
    .glow {
      filter: drop-shadow(0 0 6px currentColor);
      text-shadow: 0 0 4px currentColor;
    }
  </style>
</head>

<body>
<script>
  /* ================================
     WebSocket 接続
     ================================ */
  const ws = new WebSocket('wss://danmaku-server.onrender.com');

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    spawnComment(data);

    // Electron 側へ CSV 保存
    window.electronAPI.saveComment(data);
  };

  /* ================================
     レーン管理（重ならない弾幕）
     ================================ */
  const laneCount = 25;
  const lanes = Array(laneCount).fill(0);
  const laneHeight = window.innerHeight / laneCount;

  function getLane(durationMs) {
    const now = performance.now();
    let bestLane = 0;
    let earliest = Infinity;

    for (let i = 0; i < laneCount; i++) {
      if (lanes[i] < earliest) {
        earliest = lanes[i];
        bestLane = i;
      }
    }

    lanes[bestLane] = now + durationMs;
    return bestLane;
  }

  /* ================================
     コメント生成（固定表示モード対応）
     ================================ */
  function spawnComment({ text, color, size, speed, fixed, glow }) {

    const div = document.createElement('div');
    div.className = 'comment';
    div.textContent = text;

    /* ★ 発光 ON のとき glow クラスを付与 */
    if (glow === true || glow === "true") {
      div.classList.add("glow");
    }

    /* 色 */
    div.style.color = color || 'white';

    /* サイズ */
    const sizeMap = { small: '48px', medium: '60px', large: '90px', xlarge: '120px' };
    div.style.fontSize = sizeMap[size] || '60px';

    /* ================================
       固定表示モード
       ================================ */
    if (fixed === true || fixed === "true") {
      const lane = Math.floor(Math.random() * laneCount);
      const y = lane * laneHeight;

      div.style.left = '50%';
      div.style.top = y + 'px';
      div.style.transform = 'translateX(-50%)';

      document.body.appendChild(div);

      setTimeout(() => div.remove(), 3000);
      return;
    }

    /* ================================
       通常の流れる弾幕（重ならない）
       ================================ */
    const duration = speed || 12;
    const durationMs = duration * 1000;

    const lane = getLane(durationMs);
    const y = lane * laneHeight;

    div.style.top = y + 'px';

    let x = window.innerWidth;
    div.style.left = x + 'px';

    document.body.appendChild(div);

    const pxPerSec = window.innerWidth / duration;
    const pxPerFrame = pxPerSec / 60;

    function animate() {
      x -= pxPerFrame;
      div.style.left = x + 'px';

      const rect = div.getBoundingClientRect();
      if (rect.right < 0) {
        div.remove();
        return;
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  }
</script>
</body>
</html>
