<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: rgba(0,0,0,0);
    }

    .comment {
      position: absolute;
      white-space: nowrap;
      text-shadow: 2px 2px 4px black;
      font-weight: bold;
    }
  </style>
</head>
<body>

<script>
/* ============================================
   WebSocket 接続（Promise 対応版）
   ============================================ */

(async () => {

  // ★ Promise を await で解決する（最重要）
  const WS_URL   = await window.electronAPI.getWSUrl();
  const WS_TOKEN = await window.electronAPI.getWSToken();

  console.log("WS_URL:", WS_URL);
  console.log("WS_TOKEN:", WS_TOKEN);

  let ws = null;

  function connectWS() {

    ws = new WebSocket(`${WS_URL}?token=${WS_TOKEN}`);

    ws.onopen = () => {
      console.log("WebSocket connected");
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      spawnComment(data);
      window.electronAPI.saveComment(data);
    };

    ws.onerror = (err) => {
      console.log("WebSocket error:", err);
      ws.close();
    };

    ws.onclose = () => {
      console.log("WebSocket closed. Reconnecting in 3 seconds...");
      setTimeout(connectWS, 3000);
    };
  }

  connectWS();

})();
</script>


<script>
  /* ================================
     レーン管理（重ならない弾幕）
     ================================ */

  const laneCount = 15;
  const lanes = Array(laneCount).fill(0);

  const maxFontSize = 120;
  const fullHeight = window.screen.height;
  const effectiveHeight = fullHeight - (maxFontSize + 35);
  const laneHeight = effectiveHeight / laneCount;

  function getLane(durationMs) {
    const now = performance.now();
    let bestLane = 0;
    let earliest = Infinity;

    for (let i = 0; i < laneCount; i++) {
      if (lanes[i] < earliest) {
        earliest = lanes[i];
        bestLane = i;
      }
    }

    lanes[bestLane] = now + durationMs;
    return bestLane;
  }

  /* ================================
     絵文字判定 & 除去
     ================================ */
  function removeEmoji(text) {
    return text.replace(/\p{Emoji}/gu, "");
  }

  /* ================================
     コメント生成
     ================================ */
  function spawnComment({ text, color, size, speed, fixed }) {

    const cleanText = removeEmoji(text);
    if (!cleanText || cleanText.trim() === "") return;

    const div = document.createElement('div');
    div.className = 'comment';
    div.textContent = cleanText;

    div.style.color = color || '#eeeeee';

    const sizeMap = { small: '48px', medium: '60px', large: '90px', xlarge: '120px' };
    div.style.fontSize = sizeMap[size] || '60px';

    /* 固定表示 */
    if (fixed === true || fixed === "true") {
      const durationMs = 3000;
      const lane = getLane(durationMs);
      const y = lane * laneHeight;

      div.style.left = '50%';
      div.style.top = y + 'px';
      div.style.transform = 'translateX(-50%)';

      document.body.appendChild(div);

      setTimeout(() => div.remove(), 3000);
      return;
    }

    /* 流れる弾幕 */
    const duration = speed || 12;
    const durationMs = duration * 1000;

    const lane = getLane(durationMs);
    const y = lane * laneHeight;

    div.style.top = y + 'px';

    let x = window.innerWidth;
    div.style.left = x + 'px';

    document.body.appendChild(div);

    const pxPerSec = window.innerWidth / duration;
    const pxPerFrame = pxPerSec / 60;

    function animate() {
      x -= pxPerFrame;
      div.style.left = x + 'px';

      const rect = div.getBoundingClientRect();
      if (rect.right < 0) {
        div.remove();
        return;
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  }
</script>

</body>
</html>
