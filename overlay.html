<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    /* ============================
       発光＋縁取り＋滑らかアニメーション
       ============================ */
    .comment {
      position: absolute;
      white-space: nowrap;
      font-weight: bold;

      /* 発光エフェクト */
      filter: drop-shadow(0 0 6px currentColor);
      text-shadow: 0 0 4px currentColor;

      /* アニメーション（CSSで滑らかに流す） */
      animation-name: danmakuMove;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }

    /* 左→右へ滑らかに流れる */
    @keyframes danmakuMove {
      from { transform: translateX(100vw); }
      to   { transform: translateX(-100%); }
    }
  </style>
</head>

<body>
<script>
  /* ================================
     WebSocket 接続
     ================================ */
  const ws = new WebSocket('wss://danmaku-server.onrender.com');

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    spawnComment(data);

    // Electron 側へ CSV 保存
    window.electronAPI.saveComment(data);
  };

  /* ================================
     レーン管理（重ならない弾幕）
     ================================ */
  const laneCount = 30;
  const lanes = Array(laneCount).fill(0);  // 各レーンが「いつ空くか」
  const laneHeight = window.innerHeight / laneCount;

  function getLane(durationMs) {
    const now = performance.now();
    let bestLane = 0;
    let earliest = Infinity;

    for (let i = 0; i < laneCount; i++) {
      if (lanes[i] < earliest) {
        earliest = lanes[i];
        bestLane = i;
      }
    }

    // このレーンは durationMs 後に空く
    lanes[bestLane] = now + durationMs;
    return bestLane;
  }

  /* ================================
     コメント生成（③④⑥ 全部入り）
     ================================ */
  function spawnComment({ text, color, size, speed, fixed }) {
    const div = document.createElement('div');
    div.className = 'comment';
    div.textContent = text;

    /* 色（発光エフェクトに currentColor が使われる） */
    div.style.color = color || 'white';

    /* サイズ */
    const sizeMap = { small: '48px', medium: '60px', large: '90px', xlarge: '120px' };
    div.style.fontSize = sizeMap[size] || '60px';

    /* 固定表示モード（中央固定） */
    if (fixed === true || fixed === "true") {
      const lane = Math.floor(Math.random() * laneCount);
      const y = lane * laneHeight;

      div.style.left = '50%';
      div.style.top = `${y}px`;
      div.style.transform = 'translateX(-50%)';

      document.body.appendChild(div);

      setTimeout(() => div.remove(), 3000);
      return;
    }

    /* ================================
       流れる弾幕（CSSアニメーション）
       ================================ */

    const durationSec = speed || 12;
    const durationMs = durationSec * 1000;

    const lane = getLane(durationMs);
    const y = lane * laneHeight;

    div.style.top = `${y}px`;

    // CSS アニメーションの時間を設定
    div.style.animationDuration = `${durationSec}s`;

    document.body.appendChild(div);

    // アニメーション終了後に削除
    div.addEventListener('animationend', () => {
      div.remove();
    });
  }
</script>
</body>
</html>
