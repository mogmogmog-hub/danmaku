<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>コメント投稿</title>

  <link rel="stylesheet" href="/css/comment.css">
</head>

<body>
  <h1>コメント投稿</h1>

  <div class="input-row">
    <input id="text" placeholder="コメントを入力">
    <button id="sendBtn" onclick="send(this)" disabled style="background-color:#FAD4A0;">送信</button>
  </div>
  
  <div id="status"></div>
  
  <div class="number-buttons">
    <button onclick="sendNumber('1', this)" style="background-color:#F0F0F0;">1</button>
    <button onclick="sendNumber('2', this)" style="background-color:#F0F0F0;">2</button>
    <button onclick="sendNumber('3', this)" style="background-color:#F0F0F0;">3</button>
    <button onclick="sendNumber('4', this)" style="background-color:#F0F0F0;">4</button>
    <button onclick="sendNumber('5', this)" style="background-color:#F0F0F0;">5</button>
    <button onclick="sendNumber('6', this)" style="background-color:#F0F0F0;">6</button>
  </div>

  <div class="emoji-buttons">
    <button onclick="sendNumber('👍', this)" style="background-color:#F0F0F0;">👍</button>
    <button onclick="sendNumber('👏', this)" style="background-color:#F0F0F0;">👏</button>
    <button onclick="sendNumber('❗', this)" style="background-color:#F0F0F0;">❗</button>
    <button onclick="sendNumber('❓', this)" style="background-color:#F0F0F0;">❓</button>
    <button onclick="sendNumber('⭐', this)" style="background-color:#F0F0F0;">⭐</button>
    <button onclick="sendNumber('❤️', this)" style="background-color:#F0F0F0;">❤️</button>
  </div>

  <div class="group">
    <label>文字の色：</label>
    <div class="color-grid">
      <label class="color-btn" style="background:#eeeeee;"><input type="radio" name="color" value="#eeeeee" checked></label>
      <label class="color-btn" style="background:#00ff00;"><input type="radio" name="color" value="#00ff00"></label>
      <label class="color-btn" style="background:#ffff00;"><input type="radio" name="color" value="#ffff00"></label>
      <label class="color-btn" style="background:#ff0000;"><input type="radio" name="color" value="#ff0000"></label>
      <label class="color-btn" style="background:#0000ff;"><input type="radio" name="color" value="#0000ff"></label>
      <label class="color-btn" style="background:#66ccff;"><input type="radio" name="color" value="#66ccff"></label>
      <label class="color-btn" style="background:#ff9900;"><input type="radio" name="color" value="#ff9900"></label>
      <label class="color-btn" style="background:#ff66cc;"><input type="radio" name="color" value="#ff66cc"></label>
      <label class="color-btn" style="background:#cc66ff;"><input type="radio" name="color" value="#cc66ff"></label>
      <label class="color-btn" style="background:#000000;"><input type="radio" name="color" value="#000000"></label>
    </div>
  </div>

  <div class="group">
    <label>文字サイズ：</label>
    <div class="options">
      <label><input type="radio" name="size" value="small"> 小</label>
      <label><input type="radio" name="size" value="medium" checked> 中</label>
      <label><input type="radio" name="size" value="large"> 大</label>
      <label><input type="radio" name="size" value="xlarge"> 特大</label>
    </div>
  </div>
  
  <div class="group">
    <label>表示位置：</label>
    <div class="options">
      <label><input type="radio" name="laneRange" value="default" checked> デフォルト</label>
      <label><input type="radio" name="laneRange" value="top"> 上段</label>
      <label><input type="radio" name="laneRange" value="middle"> 中段</label>
      <label><input type="radio" name="laneRange" value="bottom"> 下段</label>
    </div>
  </div>
  
  <div class="group">
    <label>表示速度：</label>
    <div class="options">
      <label><input type="radio" name="speed" value="auto" checked> 自動</label>
      <label><input type="radio" name="speed" value="8"> 普通</label>
	  <label><input type="radio" name="speed" value="4"> はやい</label>
	  <label><input type="radio" name="speed" value="2"> 超高速</label>
    </div>
  </div>
  <div class="group">
    <label>表示モード：</label>
    <div class="options">
      <label><input type="radio" name="fixed" value="false" checked> 流れる（通常）</label>
      <label><input type="radio" name="fixed" value="true"> 固定表示</label>
    </div>
  </div>

  <script>
    /* ================================
       色選択の視認性向上
       ================================ */
    const defaultColorBtn = document.querySelector('.color-btn input:checked');
    if (defaultColorBtn) {
      defaultColorBtn.parentElement.classList.add('selected');
    }

    const colorButtons = document.querySelectorAll(".color-btn");
    colorButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        colorButtons.forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        btn.querySelector("input").checked = true;
      });
    });

    function getFixedMode() {
      return document.querySelector('input[name="fixed"]:checked').value === "true";
    }

    /* ================================
       クールタイム管理
       ================================ */
    let lastSendTime = 0;

    function canSend() {
      const now = Date.now();
      if (now - lastSendTime < 2000) return false;
      lastSendTime = now;
      return true;
    }

    /* ================================
       256文字制限
       ================================ */
    function isTooLong(text) {
      return text.length > 256;
    }

    /* ================================
       studentId がない場合はログインへ
       ================================ */
    const studentId = localStorage.getItem("studentId");
    if (!studentId) {
      window.location.href = "/login.html";
    }

    /* ================================
       入力欄が空なら送信ボタンを無効化
       ================================ */
    const textInput = document.getElementById("text");
    const sendBtn = document.getElementById("sendBtn");

    textInput.addEventListener("input", () => {
      sendBtn.disabled = textInput.value.trim() === "";
    });

    sendBtn.disabled = true;

    /* ================================
       送信処理（表示位置追加版）
       ================================ */
    async function send(btn) {
      if (!canSend()) return;

      const text = textInput.value.trim();
      if (isTooLong(text)) return;

      const color = document.querySelector('input[name="color"]:checked').value;
      const size  = document.querySelector('input[name="size"]:checked').value;
      const speed = Number(document.querySelector('input[name="speed"]:checked').value);
      const fixed = getFixedMode();
      const laneRange = document.querySelector('input[name="laneRange"]:checked').value;

      const status = document.getElementById("status");

      btn.disabled = true;
      btn.classList.add("sending");
      btn.textContent = "送信…";

      try {
        await fetch('/comment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, color, size, speed, studentId, fixed, laneRange })
        });

        status.textContent = "送信しました";
        setTimeout(() => status.textContent = "", 2000);

        textInput.value = '';
        textInput.focus();
        sendBtn.disabled = true;

      } catch (e) {
        status.textContent = "通信エラーが発生しました";
      }

      btn.disabled = false;
      btn.classList.remove("sending");
      btn.textContent = "送信";
    }

    /* ================================
       数字ボタン送信（表示位置追加版）
       ================================ */
    async function sendNumber(textValue, btn) {
      if (!canSend()) return;
      if (isTooLong(textValue)) return;

      const color = document.querySelector('input[name="color"]:checked').value;
      const size  = document.querySelector('input[name="size"]:checked').value;
      const speed = Number(document.querySelector('input[name="speed"]:checked').value);
      const fixed = getFixedMode();
      const laneRange = document.querySelector('input[name="laneRange"]:checked').value;

      const status = document.getElementById("status");

      btn.disabled = true;
      btn.classList.add("sending");
      const originalText = btn.textContent;
      btn.textContent = "送信…";

      try {
        await fetch('/comment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: textValue, color, size, speed, studentId, fixed, laneRange })
        });

        status.textContent = "送信しました";
        setTimeout(() => status.textContent = "", 2000);

      } catch (e) {
        status.textContent = "通信エラーが発生しました";
      }

      btn.disabled = false;
      btn.classList.remove("sending");
      btn.textContent = originalText;
    }
  </script>

</body>
</html>
