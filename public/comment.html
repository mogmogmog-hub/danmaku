<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>コメント投稿</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;

      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ★ スマホ向け：左右の余白をなくす＋幅を100%にする */
    @media (max-width: 480px) {
      body {
        max-width: 100%;
        margin: 0;
        padding: 10px;
      }
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-row input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }

    .input-row button {
      padding: 10px 20px;
      font-size: 16px;
      white-space: nowrap;
    }

    .number-buttons,
    .understanding-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .number-buttons button,
    .understanding-buttons button {
      flex: 1;
      padding: 12px;
      font-size: 18px;
    }

    .group {
      margin-bottom: 20px;
    }

    .group label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .color-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .color-btn.selected {
      outline: 3px solid #000;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    /* ★ スマホ向けレイアウト調整 */
    @media (max-width: 480px) {
      .input-row {
        flex-direction: column;
      }

      .input-row button {
        width: 100%;
      }

      .number-buttons button,
      .understanding-buttons button {
        flex: none;
        width: 45%;
      }
    }
  </style>
</head>

<body>
  <h1>コメント投稿</h1>

  <div class="input-row">
    <input id="text" placeholder="コメントを入力">
    <button onclick="send()">送信</button>
  </div>

  <div class="number-buttons">
    <button onclick="sendNumber('1')">1</button>
    <button onclick="sendNumber('2')">2</button>
    <button onclick="sendNumber('3')">3</button>
    <button onclick="sendNumber('4')">4</button>
    <button onclick="sendNumber('5')">5</button>
    <button onclick="sendNumber('6')">6</button>
  </div>

  <div class="understanding-buttons">
    <button onclick="sendNumber('わからない ×')">わからない ×</button>
    <button onclick="sendNumber('わかった 〇')" style="background-color:#FAD4A0;">わかった 〇</button>
  </div>

  <div class="group">
    <label>文字の色：</label>
    <div class="color-grid">
      <label class="color-btn" style="background:#ffffff;"><input type="radio" name="color" value="#ffffff" checked></label>
      <label class="color-btn" style="background:#ff0000;"><input type="radio" name="color" value="#ff0000"></label>
      <label class="color-btn" style="background:#00ff00;"><input type="radio" name="color" value="#00ff00"></label>
      <label class="color-btn" style="background:#0000ff;"><input type="radio" name="color" value="#0000ff"></label>
      <label class="color-btn" style="background:#ffff00;"><input type="radio" name="color" value="#ffff00"></label>
      <label class="color-btn" style="background:#cc66ff;"><input type="radio" name="color" value="#cc66ff"></label>
      <label class="color-btn" style="background:#66ccff;"><input type="radio" name="color" value="#66ccff"></label>
      <label class="color-btn" style="background:#ff9900;"><input type="radio" name="color" value="#ff9900"></label>
      <label class="color-btn" style="background:#ff66cc;"><input type="radio" name="color" value="#ff66cc"></label>
    </div>
  </div>

  <div class="group">
    <label>文字サイズ：</label>
    <div class="options">
      <label><input type="radio" name="size" value="small"> 小</label>
      <label><input type="radio" name="size" value="medium" checked> 中</label>
      <label><input type="radio" name="size" value="large"> 大</label>
      <label><input type="radio" name="size" value="xlarge"> 特大</label>
    </div>
  </div>

  <div class="group">
    <label>表示速度：</label>
    <div class="options">
      <label><input type="radio" name="speed" value="12" checked> 普通</label>
      <label><input type="radio" name="speed" value="8"> 速い</label>
      <label><input type="radio" name="speed" value="4"> 高速</label>
      <label><input type="radio" name="speed" value="2"> 超高速</label>
    </div>
  </div>

  <div class="group">
    <label>表示モード：</label>
    <div class="options">
      <label><input type="radio" name="fixed" value="false" checked> 流れる（通常）</label>
      <label><input type="radio" name="fixed" value="true"> 固定表示</label>
    </div>
  </div>

  <script>
    const colorButtons = document.querySelectorAll(".color-btn");
    colorButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        colorButtons.forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        btn.querySelector("input").checked = true;
      });
    });

    function getFixedMode() {
      return document.querySelector('input[name="fixed"]:checked').value === "true";
    }

    async function send() {
      const text = document.getElementById('text').value;
      const color = document.querySelector('input[name="color"]:checked').value;
      const size  = document.querySelector('input[name="size"]:checked').value;
      const speed = Number(document.querySelector('input[name="speed"]:checked').value);
      const fixed = getFixedMode();
      const studentId = localStorage.getItem("studentId");

      await fetch('/comment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, color, size, speed, studentId, fixed })
      });

      document.getElementById('text').value = '';
    }

    async function sendNumber(textValue) {
      const color = document.querySelector('input[name="color"]:checked').value;
      const size  = document.querySelector('input[name="size"]:checked').value;
      const speed = Number(document.querySelector('input[name="speed"]:checked').value);
      const fixed = getFixedMode();
      const studentId = localStorage.getItem("studentId");

      await fetch('/comment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: textValue, color, size, speed, studentId, fixed })
      });
    }
  </script>

</body>
</html>
