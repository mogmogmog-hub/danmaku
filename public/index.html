<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 400px;
      margin: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }

    @media (max-width: 480px) {
      body {
        max-width: 100%;
        margin: 0;
        padding: 10px;
      }
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      margin-top: 10px;
    }

    #error {
      color: red;
      margin-top: 10px;
      text-align: center;
      min-height: 24px;
    }
  </style>
</head>

<body>
  <h1>ログイン</h1>

  <input id="studentId" placeholder="学籍番号を入力" autofocus>
  <input id="password" type="password" placeholder="パスワードを入力">

  <button id="loginBtn" onclick="login()" style="background-color:#FAD4A0;">ログイン</button>

  <div id="error"></div>

  <script>
    async function login() {
      const studentId = document.getElementById('studentId').value.trim();
      const password  = document.getElementById('password').value.trim();
      const errorBox  = document.getElementById('error');
      const btn       = document.getElementById('loginBtn');

      errorBox.textContent = "";

      // 入力チェック
      if (!studentId) {
        errorBox.textContent = "学籍番号を入力してください";
        return;
      }
      if (!password) {
        errorBox.textContent = "パスワードを入力してください";
        return;
      }

      // ローディング状態
      btn.disabled = true;
      btn.textContent = "ログイン中…";

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ studentId, password })
        });

        const result = await res.json();

        if (result.ok) {
          localStorage.setItem("studentId", studentId);
          window.location.href = "/comment.html";
        } else {
          errorBox.textContent = "学籍番号またはパスワードが違います";
        }
      } catch (e) {
        errorBox.textContent = "通信エラーが発生しました";
      }

      // ボタンを元に戻す
      btn.disabled = false;
      btn.textContent = "ログイン";
    }

    // Enterキーでログイン
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });
  </script>
</body>
</html>
