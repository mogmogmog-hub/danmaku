<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>NGワード管理</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  textarea { width: 100%; height: 300px; font-size: 16px; }
  button { padding: 10px 20px; font-size: 16px; margin-top: 10px; }
</style>
</head>
<body>

<h2>NGワード管理</h2>
<p>1行につき1ワードを入力してください。</p>

<textarea id="ngwords"></textarea>
<br>
<button onclick="save()">保存する</button>

<script>
async function load() {
  const res = await fetch('/ngwords');
  const data = await res.json();
  document.getElementById('ngwords').value = data.words.join("\n");
}

async function save() {
  const text = document.getElementById('ngwords').value;
  const words = text.split(/\r?\n/).map(w => w.trim()).filter(w => w !== "");

  const res = await fetch('/ngwords', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ words })
  });

  const result = await res.json();
  if (result.ok) {
    alert("保存しました！");
  } else {
    alert("保存に失敗しました");
  }
}

load();
</script>

</body>
</html>
